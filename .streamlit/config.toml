# Base theme; accent/alert colours are user-editable in Settings and injected as CSS.
[theme]
base = "dark"
primaryColor = "#7C5CFF"
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#12151C"
textColor = "#E6E8EE"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
